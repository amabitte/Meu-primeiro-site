<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Primeiro App na Vercel</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .cartao {
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="cartao">
    <h1>Olá, Vercel! 🚀</h1>
    <p>Este é o meu primeiro projeto publicado na nuvem.</p>
    <button onclick="alert('Funcionou! O código está vivo na internet.')">Clique para testar</button>
  </div>
</body>
</html>
